<script>
'use strict';
const KEY='my_sport_v1';
const defaults={
 'Upper A':[
  {name:'Жим гантелей на наклонной скамье',weight:'',sets:3,goal:'8–12'},
  {name:'Тяга верхнего блока',weight:'55',sets:3,goal:'8–12'},
  {name:'Горизонтальная тяга блока',weight:'50',sets:3,goal:'8–12'},
  {name:'Жим плеч в тренажёре',weight:'32',sets:2,goal:'8–12'},
  {name:'Разгибание рук с канатом',weight:'17.5',sets:2,goal:'10–15'},
  {name:'Подъём гантелей на бицепс',weight:'12',sets:2,goal:'10–15'}],
 'Lower A':[
  {name:'Приседания со штангой',weight:'45',sets:3,goal:'8'},
  {name:'Румынская тяга',weight:'45',sets:2,goal:'10'},
  {name:'Жим ногами',weight:'85',sets:2,goal:'12'},
  {name:'Икры сидя',weight:'27.5',sets:3,goal:'12–15'}],
 'Upper B':[
  {name:'Жим гантелей лёжа',weight:'',sets:3,goal:'8–12'},
  {name:'Тяга верхнего блока',weight:'55',sets:3,goal:'8–12'},
  {name:'Тяга горизонтального блока',weight:'50',sets:3,goal:'8–12'},
  {name:'Жим в грудном тренажёре',weight:'',sets:2,goal:'8–12'},
  {name:'Разведения гантелей в стороны',weight:'7',sets:2,goal:'12–15'},
  {name:'Сгибание рук на бицепс',weight:'12',sets:2,goal:'10–15'},
  {name:'Трицепс на блоке',weight:'17.5',sets:2,goal:'10–15'}],
 'Lower B':[
  {name:'Приседания со штангой',weight:'60',sets:3,goal:'8–10'},
  {name:'Румынская тяга',weight:'60',sets:3,goal:'8–12'},
  {name:'Жим ногами',weight:'100',sets:3,goal:'10–12'},
  {name:'Сгибание ног в тренажёре',weight:'59',sets:3,goal:'10–15'},
  {name:'Икры сидя',weight:'30',sets:3,goal:'12–15'}]
};
const copy=x=>JSON.parse(JSON.stringify(x));
function initial(){return {templates:copy(defaults),workouts:[],pool:[],steps:[],bodyweight:[],measurements:[],drafts:{},current:'Upper A'}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!data.templates)throw Error('Invalid');}catch(e){data=initial()}
// 2026-11-05: one-time return-to-training Lower A plan update.
// Update only planned weights, never completed sessions; retain any logged sets.
(function applyLowerAReturnPlan(){
 const marker='my_sport_lower_a_20261105_v1';
 if(localStorage.getItem(marker)==='1')return;
 const target=defaults['Lower A'];
 const update=arr=>{
  if(!Array.isArray(arr))return;
  for(const ex of arr){
   const p=target.find(x=>x.name===ex.name);
   if(!p)continue;
   ex.weight=p.weight;
   ex.goal=p.goal;
   ex.sets=p.sets;
   if(Array.isArray(ex.reps))ex.reps=Array.from({length:Math.max(p.sets,ex.reps.filter((v,i)=>v!==''||(ex.rirs||[])[i]!=='').length)},(_,i)=>ex.reps[i]??'');
   if(Array.isArray(ex.rirs))ex.rirs=Array.from({length:ex.reps.length},(_,i)=>ex.rirs[i]??'');
  }
  // Remove obsolete hamstring curl only when no results have been entered.
  const idx=arr.findIndex(x=>x.name==='Сгибание ног в тренажёре');
  if(idx>=0 && (!Array.isArray(arr[idx].reps)||arr[idx].reps.every(v=>v==='')) && !arr[idx].comment)arr.splice(idx,1);
 };
 update(data.templates['Lower A']);
 if(data.drafts?.['Lower A'])update(data.drafts['Lower A'].exercises);
 try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(marker,'1')}catch(e){}
})();
let tab='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Nutrition and Google Health can update the same localStorage key from their own pages.
// Always refresh those externally managed collections before reading or writing the main state.
function refreshExternalData(){
 let stored;
 try{stored=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return}
 if(!stored||typeof stored!=='object'||!stored.templates)return;
 for(const key of ['nutritionDays','googleHealthDays']){
  if(Array.isArray(stored[key]))data[key]=stored[key];
 }
 if(stored.googleHealthLastSync)data.googleHealthLastSync=stored.googleHealthLastSync;
}
function save(){
 try{
  refreshExternalData();
  localStorage.setItem(KEY,JSON.stringify(data));
  return true;
 }catch(e){alert('Не удалось сохранить данные в браузере. Скопируй резервную копию.');return false}
}
function today(){return new Date().toLocaleDateString('sv-SE')}
function fmt(d){if(!d)return '';let a=d.split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d}

function nextMotivation(){
 let last=-1;try{last=Number(localStorage.getItem('my_sport_last_motivation'))}catch(e){}
 const n=motivationItems.length;
 let idx=Math.floor(Math.random()*(n-1));
 if(last>=0&&last<n&&idx>=last)idx++;
 try{localStorage.setItem('my_sport_last_motivation',String(idx))}catch(e){}
 return motivationItems[idx];
}
let currentMotivation=nextMotivation();
window.refreshMotivation=()=>{currentMotivation=nextMotivation();renderHome()};

let trainingCalendarMonth=today().slice(0,7);
let trainingCalendarSelected=today();
function trainingMonthShift(month,change){
 const v=month.split('-').map(Number),d=new Date(v[0],v[1]-1+change,1,12);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function calendarDateEvents(date){
 const workouts=(data.workouts||[]).filter(w=>w.date===date).map(w=>({
  icon:String(w.name||'').startsWith('Upper')?'💪':String(w.name||'').startsWith('Lower')?'🦵':'🏋️',
  label:w.name||'Силовая',
  detail:(w.exercises||[]).filter(e=>(e.reps||[]).some(v=>v!=='')).length+' упражнений'+(w.comment?' · '+w.comment:'')
 }));
 const sports=(data.activities||[]).filter(x=>x.date===date).map(x=>({icon:(SPORT_TYPES[x.type]||SPORT_TYPES.other).icon,label:(SPORT_TYPES[x.type]||SPORT_TYPES.other).name,detail:sportDescription(x)}));
 return workouts.concat(sports);
}
function trainingCalendarMarkup(){
 const parts=trainingCalendarMonth.split('-').map(Number),y=parts[0],m=parts[1];
 const first=new Date(y,m-1,1,12),days=new Date(y,m,0).getDate(),empty=(first.getDay()+6)%7;
 const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],title=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 let grid='';
 for(let i=0;i<empty;i++)grid+='<span class="training-day-empty"></span>';
 for(let n=1;n<=days;n++){
  const date=trainingCalendarMonth+'-'+String(n).padStart(2,'0'),events=calendarDateEvents(date),icons=[...new Set(events.map(x=>x.icon))].slice(0,3).join('');
  const names=events.map(x=>x.label).join(', ');
  grid+='<button type="button" class="training-day'+(date===today()?' is-today':'')+(date===trainingCalendarSelected?' is-picked':'')+(events.length?' has-session':'')+'" data-training-date="'+date+'" aria-label="'+date+(events.length?' — '+esc(names):' — занятий нет')+'"'+(date>today()?' disabled':'')+'><span class="num">'+n+'</span><span class="training-emoji">'+icons+'</span>'+(events.length>3?'<span class="small">+'+(events.length-3)+'</span>':'')+'</button>';
 }
 const chosen=calendarDateEvents(trainingCalendarSelected);
 const detail=chosen.length?chosen.map(e=>'<div class="entry"><b>'+e.icon+' '+esc(e.label)+'</b><div class="hint">'+esc(e.detail)+'</div></div>').join(''):'<div class="hint">В этот день тренировок и занятий нет.</div>';
 return '<div class="training-calendar"><div class="training-cal-head"><strong>🗓️ '+esc(title)+'</strong><div class="training-cal-nav"><button type="button" data-training-month="-1" aria-label="Предыдущий месяц">‹</button><button type="button" data-training-month="1" aria-label="Следующий месяц"'+(trainingCalendarMonth>=today().slice(0,7)?' disabled':'')+'>›</button></div></div><div class="training-week">'+weekdays.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="training-month-grid">'+grid+'</div><div class="training-cal-legend">💪 Upper · 🦵 Lower · 🏊 плавание · другие значки по видам активности</div><div class="training-cal-detail"><b>'+fmt(trainingCalendarSelected)+'</b>'+detail+'</div></div>';
}
document.addEventListener('click',event=>{
 const monthButton=event.target.closest('[data-training-month]');
 if(monthButton){
  const month=trainingMonthShift(trainingCalendarMonth,Number(monthButton.dataset.trainingMonth));
  if(month>today().slice(0,7))return;
  trainingCalendarMonth=month;
  trainingCalendarSelected=month===today().slice(0,7)?today():month+'-01';
  renderHome();renderRecords();
  return;
 }
 const dateButton=event.target.closest('[data-training-date]');
 if(dateButton){
  trainingCalendarSelected=dateButton.dataset.trainingDate;
  renderHome();renderRecords();
 }
});


function nutritionHomeCard(){
 const days=Array.isArray(data.nutritionDays)?data.nutritionDays:[];
 const todayEntry=days.find(x=>x.date===today());
 const last=days.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
 const entry=todayEntry||last;
 const caption=todayEntry?'Сегодня':last?'Последняя запись: '+fmt(last.date):'Дневник питания';
 const calories=entry&&Number.isFinite(Number(entry.kcal))?Math.round(Number(entry.kcal)):null;
 const progress=calories===null?0:Math.min(100,Math.round(calories/2300*100));
 const macros=entry?'Б '+Math.round(Number(entry.protein)||0)+' г · Ж '+Math.round(Number(entry.fat)||0)+' г · У '+Math.round(Number(entry.carbs)||0)+' г':'Подтверждённые итоги дня и история питания';
 return '<a class="nutrition-home-card" href="./nutrition.html" aria-label="Открыть дневник питания"><div class="row between"><div><div class="nutrition-eyebrow">🥗 ПИТАНИЕ</div><div class="nutrition-home-title">'+(calories===null?'Начать вести питание':calories.toLocaleString('ru-RU')+' <span>ккал</span>')+'</div><div class="nutrition-home-sub">'+esc(caption)+' · '+esc(macros)+'</div></div><div class="nutrition-go">↗</div></div>'+(calories===null?'':'<div class="nutrition-progress"><div style="width:'+progress+'%"></div></div>')+'</a>';
}

window.saveQuickWeight=event=>{
 event.preventDefault();
 const f=event.currentTarget,date=f.elements.date.value,raw=String(f.elements.weight.value).replace(',','.'),weight=Number(raw);

 const old=copy(data.bodyweight||[]);
 data.bodyweight=old.filter(x=>x.date!==date).concat([{date,weight:String(weight)}]).sort((a,b)=>b.date.localeCompare(a.date));
 if(!save()){data.bodyweight=old;return}
 renderHome();renderRecords();renderActivity();
 const status=document.getElementById('quickWeightStatus');
 if(status)status.textContent='✓ '+fmt(date)+': '+weight.toLocaleString('ru-RU')+' кг. Вес сохранён в дневник и попадёт в полный отчёт.';
};

n class="badge">Сохранено</span></div>`:'<div class="muted">Пока нет силовых тренировок</div>'}<hr style="border:0;border-top:1px solid #2e4154;margin:14px 0"><div class="row between"><div>Занятия</div><div class="muted">${recentSport?esc(sportName(recentSport))+' · '+fmt(recentSport.date):'Нет записей'}</div></div><div class="row between" style="margin-top:12px"><div>Шаги</div><div class="muted">${recentSteps?fmt(recentSteps.date)+' · '+Number(recentSteps.count).toLocaleString('ru-RU'):'Нет записей'}</div></div></div><div class="notice">Первые 2 недели: 2 облегчённые силовые + умеренная активность по самочувствию. Когда войдёшь в ритм — вернём 4 силовые.</div>`}
window.goWorkout=n=>{data.current=n;save();selectTab('train')};
function ensureSetWeights(ex){
 if(!Array.isArray(ex.setWeights))ex.setWeights=Array.from({length:ex.reps.length},()=>String(ex.weight??''));
 while(ex.setWeights.length<ex.reps.length)ex.setWeights.push(String(ex.weight??''));
 if(ex.setWeights.length>ex.reps.length)ex.setWeights.length=ex.reps.length;
 return ex;
}
function setWeightAt(ex,j){return String(ex.setWeights?.[j]??ex.weight??'')}
function getDraft(){let name=data.current;if(!data.drafts[name])data.drafts[name]={date:today(),exercises:data.templates[name].map(e=>({...copy(e),reps:Array(e.sets).fill(''),rirs:Array(e.sets).fill(''),comment:''})),comment:''};data.drafts[name].exercises.forEach(ensureSetWeights);return data.drafts[name]}
function setCurrent(n){data.current=n;save();renderTrain()}

function goalRange(goal){const m=String(goal||'').match(/(\d+)\s*[–—-]\s*(\d+)/);return m?[+m[1],+m[2]]:[8,12]}
function exerciseHistory(name,date){const norm=x=>String(x||'').toLocaleLowerCase('ru-RU').trim();return data.workouts.filter(w=>!date||w.date<=date).flatMap(w=>(w.exercises||[]).filter(e=>norm(e.name)===norm(name)).map(e=>({...e,date:w.date,workoutComment:w.comment||''}))).filter(e=>Number(e.weight)>0&&Array.isArray(e.reps)&&e.reps.some(x=>x!==''&&Number(x)>0)).sort((a,b)=>b.date.localeCompare(a.date))}
function progressionAdvice(ex,date){
 const h=exerciseHistory(ex.name,date),last=h[0];
 if(!last)return {type:'first',label:'Первая тренировка',description:'Пока нет истории. Подбери комфортный вес с запасом 3–4 повторения.',weight:null};
 const loggedWeights=(last.reps||[]).map((v,j)=>v!==''&&Number(v)>0?Number(setWeightAt(last,j)):null).filter(v=>v>0);
 const mixedWeights=new Set(loggedWeights).size>1;
 const weight=loggedWeights.length?loggedWeights[loggedWeights.length-1]:Number(last.weight),[lo,hi]=goalRange(last.goal||ex.goal);
 const filled=last.reps.map((v,i)=>({rep:Number(v),rir:last.rirs?.[i]})).filter((x,i)=>last.reps[i]!==''&&Number.isFinite(x.rep)&&x.rep>0);
 const rir=filled.map(x=>x.rir===''||x.rir===undefined?null:Number(x.rir));
 const allRir=rir.length>0&&rir.every(x=>x!==null&&Number.isFinite(x)&&x>=0);
 const minRep=Math.min(...filled.map(x=>x.rep)),minRir=allRir?Math.min(...rir):null,maxRir=allRir?Math.max(...rir):null;
 const gap=Math.max(0,Math.round((new Date((date||today())+'T12:00:00')-new Date(last.date+'T12:00:00'))/86400000));
 const discomfort=/боль|дискомфорт|травм|плох.*техник|сильн.*устал/i.test((last.comment||'')+' '+last.workoutComment);
 let weightNext=weight,type='hold',description='';
 if(mixedWeights){type='hold';description='В подходах использовались разные веса. Закрепи выбранный рабочий вес и повторения; автоматическая прибавка отключена для этой тренировки.'}
 else if(discomfort){type='caution';description='В комментарии отмечен дискомфорт. Без повышения нагрузки; при боли не продолжай упражнение.'}
 else if(gap>21){type='return';weightNext=Math.max(0.5,Math.round(weight*0.85*2)/2);description='Перерыв более 3 недель: ориентировочно на 15% легче, с запасом 3–4 повтора.'}
 else if(minRep<lo){type='hold';description='Не все подходы достигли нижней границы: повтори вес или немного снизь его.'}
 else if(filled.length<2||!allRir){type='hold';description='Для повышения нужны минимум 2 рабочих подхода и заполненный RIR. Пока повтори вес.'}
 else if(minRir<2){type='hold';description='Маленький запас повторений. Сохрани вес и прибавляй повторения, не доходя до отказа.'}
 else if(minRep>=hi&&minRir>=2&&maxRir<=5){
  const isDumbbell=/гантел|разведени/i.test(ex.name);
  const isHeavyLeg=/присед|румынск|жим ног/i.test(ex.name);
  const step=isDumbbell?2:isHeavyLeg?5:2.5;
  type='up';weightNext=weight+step;description='Все подходы достигли верхней границы при RIR ≥2. Следующий раз: прибавь '+step+' кг и вернись к нижней границе повторений.';
 }else{type='reps';description='Сохрани вес и постарайся прибавить 1–2 повтора до верхней границы диапазона.'}
 const label=type==='up'?'↑ Прибавить вес':type==='return'?'↘ После перерыва':type==='caution'?'⚠ Без прибавки':type==='reps'?'→ Добавить повторы':'→ Закрепить вес';
 return {type,label,weight:weightNext,description,previous:last};
}

const COACH_KEY='my_sport_coach_plan_v1';
let coachPlan=null;
try{const old=JSON.parse(localStorage.getItem(COACH_KEY)||'null');if(old&&old.schema===1)coachPlan=old}catch(e){}
function validCoachPlan(p){
 if(!p||p.schema!==1||!Array.isArray(p.recommendations)||p.recommendations.length>80)return false;
 return p.recommendations.every(x=>typeof x.workout==='string'&&Object.prototype.hasOwnProperty.call(defaults,x.workout)&&typeof x.exercise==='string'&&x.exercise.length<120&&Number.isFinite(x.weight)&&x.weight>0&&x.weight<500&&typeof x.reason==='string'&&x.reason.length<300&&typeof x.reps==='string'&&x.reps.length<40&&(!x.sets||(Number.isInteger(x.sets)&&x.sets>=1&&x.sets<=8))&&(!x.rir||(typeof x.rir==='string'&&x.rir.length<30)));
}
function coachRecommendation(workout,exercise){
 return coachPlan?.recommendations?.find(x=>x.workout===workout&&x.exercise.trim().toLocaleLowerCase('ru-RU')===String(exercise||'').trim().toLocaleLowerCase('ru-RU'))||null;
}
async function refreshCoachPlan(){
 try{
  const response=await fetch('./coach-plan.json?update='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Plan not available');
  const parsed=await response.json();
  if(!validCoachPlan(parsed))throw Error('Invalid plan');
  if(!coachPlan||JSON.stringify(coachPlan)!==JSON.stringify(parsed)){
   coachPlan=parsed;localStorage.setItem(COACH_KEY,JSON.stringify(parsed));
   renderTrain();renderRecords();
  }
 }catch(e){/* Offline: keep the last verified plan, never touch workout history. */}
}

window.setCurrent=setCurrent;window.changeDate=v=>{getDraft().date=v;save()};window.setWeight=(i,v)=>{const e=getDraft().exercises[i],old=String(e.weight??'');e.weight=v;e.setWeights=e.setWeights.map(w=>String(w)===old?String(v):w);save();renderTrain()};

// Импорт шага из команды iOS. Не подменяем выбранную пользователем дату.
window.pasteHealthSteps=async()=>{
 const message=document.getElementById('healthImportStatus');
 try {
  if(!navigator.clipboard||!navigator.clipboard.readText) throw Error('Нет доступа к буферу');
  const value=await navigator.clipboard.readText();
  document.getElementById('healthStepsPaste').value=value.trim();
  message.textContent='Данные вставлены. Нажми «Сохранить импортированные шаги».';
 }catch(e){message.textContent='iPhone не разрешил автоматически прочитать буфер. Зажми поле выше и выбери «Вставить».'}
};
window.importHealthSteps=()=>{
 const message=document.getElementById('healthImportStatus');
 const raw=document.getElementById('healthStepsPaste').value.trim();
 // Принимаем целые числа и типичную группировку разрядов пробелами; отклоняем случайный текст.
 if(!/^[0-9][0-9\s\u00a0\u202f]*$/.test(raw)){
  message.textContent='Нужно только количество шагов, например 10687. Проверь содержимое буфера.';return;
 }
 const count=Number(raw.replace(/\s/g,''));
 if(!Number.isSafeInteger(count)||count<0||count>150000){message.textContent='Число шагов выглядит неверным. Проверь данные.';return}
 const form=document.getElementById('stepsForm');
 const date=form.elements.date.value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){message.textContent='Выбери дату записи.';return}
 form.elements.count.value=String(count);
 activitySave('steps',form);
 message.textContent='✓ Импортировано '+count.toLocaleString('ru-RU')+' шагов за '+fmt(date)+'. Можно изменить вручную.';
};

 t.push('ЦИКЛ 4 СИЛОВЫХ: '+cycle.count+'/4'+(cycle.complete?' — полный':''));

 t.push('');
 t.push('СИЛОВЫЕ ТРЕНИРОВКИ');
 if(!(data.workouts||[]).length)t.push('Записей пока нет');

 }
 t.push('ДОПОЛНИТЕЛЬНАЯ АКТИВНОСТЬ');
 if(!(data.activities||[]).length)t.push('Записей пока нет');
 for(const p of (data.activities||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)))t.push(fmt(p.date)+': '+sportName(p)+' · '+sportDescription(p));

 t.push('','ВЕС');
 if(!(data.bodyweight||[]).length)t.push('Записей пока нет');
 for(const p of (data.bodyweight||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)))t.push(fmt(p.date)+': '+p.weight+' кг');
 t.push('','ЗАМЕРЫ ТЕЛА');
 if(!(data.measurements||[]).length)t.push('Записей пока нет');

window.sendChatGPT=async()=>{
  const txt=report();
  let copied=false;
  try { await navigator.clipboard.writeText(txt); copied=true; } catch(e) {
    let box=document.createElement('textarea');box.value=txt;box.style.position='fixed';box.style.top='0';box.style.opacity='0';document.body.appendChild(box);box.focus();box.select();
    try {copied=document.execCommand('copy')}catch(e){} box.remove();
  }
  if (!copied) {prompt('Не удалось скопировать автоматически. Скопируй отчёт:',txt);return;}
  let destination=String(data.chatUrl||'').trim();
  const ok=/^https:\/\/(?:www\.)?chatgpt\.com\/c\/[a-zA-Z0-9-]+(?:[/?#].*)?$/.test(destination);
  if (!ok) destination='https://chatgpt.com/';
  const status=document.getElementById('chatStatus');
  if(status)status.textContent='Отчёт скопирован ✓ Открой нужный чат, вставь текст и нажми отправку.';
  // Пробуем открыть установленное приложение ChatGPT, не веб-страницу.
  // Поддержка перехода в конкретную беседу зависит от iOS и версии приложения.
  let appUrl='chatgpt://';
  if(ok){
    const u=new URL(destination);
    appUrl='com.openai.chat://chatgpt.com'+u.pathname;
  }
  if(status)status.textContent='Отчёт скопирован ✓ Открываю приложение ChatGPT. Вставь отчёт и отправь.';
  window.location.href=appUrl;
};

window.editWorkoutDate=id=>{
 const workout=data.workouts.find(w=>String(w.id)===String(id));if(!workout)return;
 const requested=prompt('Дата тренировки (ГГГГ-ММ-ДД):',workout.date||today());
 if(requested===null)return;
 const date=requested.trim();
 if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)||new Date(date+'T12:00:00').toLocaleDateString('sv-SE')!==date||date>today()){
  alert('Неверная дата. Укажи дату не позднее сегодняшней в формате ГГГГ-ММ-ДД.');return;
 }
 if(date===workout.date)return;
 const previous=workout.date;workout.date=date;
 data.workouts.sort((a,b)=>b.date.localeCompare(a.date)||(Number(b.id)||0)-(Number(a.id)||0));
 if(!save()){workout.date=previous;data.workouts.sort((a,b)=>b.date.localeCompare(a.date)||(Number(b.id)||0)-(Number(a.id)||0));return}
 renderRecords();renderHome();
};

"setIncludePrivateReport(this.checked)" ${localStorage.getItem("my_sport_include_private_report")==="yes"?"checked":""} style="min-width:19px;width:19px;height:19px;margin:2px 0 0"><span><b>Включать «Личное» в отчёт</b><span class="hint" style="display:block">По желанию: категории, даты и статистика за последние 90 дней. Настройка запоминается. Записи передаются только при твоей отправке в ChatGPT.</span></span></label><button class="btn full" onclick="sendChatGPT()">↗ Открыть приложение ChatGPT</button><p id="chatStatus" class="hint" aria-live="polite">Если браузер не открыл приложение, используй кнопку «Только скопировать» и открой ChatGPT с главного экрана. Прямой переход в чат может не поддерживаться.</p><details style="margin-top:12px"><summary class="hint">Открывать именно этот чат (необязательно)</summary><p class="hint">Необязательно: вставь ссылку вида chatgpt.com/c/... — попробуем открыть конкретную беседу в приложении. Это экспериментальная возможность; ссылка «Поделиться» не подходит.</p><input id="chatUrl" type="url" inputmode="url" placeholder="https://chatgpt.com/c/..." value="${esc(data.chatUrl||'')}"><button class="btn secondary full" style="margin-top:8px" onclick="saveChatUrl()">Сохранить ссылку</button></details><div class="tools"><button class="btn secondary grow" onclick="copyReport()">⧉ Только скопировать</button></div><div class="tools"><button class="btn secondary grow" onclick="downloadBackup()">↓ Резервная копия</button><button class="btn secondary grow" onclick="restoreBackup()">↑ Восстановить</button></div><input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this)"></div><h3 class="section">Силовые тренировки</h3><div class="card">${data.workouts.length?data.workouts.map(w=>`<div class="history-item"><div class="row between"><b>${esc(w.name)}</b><button type="button" class="btn ghost" onclick="editWorkoutDate(${w.id})" title="Изменить дату тренировки">📅 ${fmt(w.date)} ✎</button></div>$ // Отдельное хранилище. Интимные записи НЕ попадают в отчёт ChatGPT и в обычную резервную копию спорта.
const PRIVATE_KEY='my_sport_intimacy_v1';
const VAULT_KEY='my_sport_intimacy_encrypted_v1';
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function derivePrivateKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function decryptPrivate(key,record){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(record.iv)},key,unb64(record.ciphertext))))}
let needsPrivateMigration=!!localStorage.getItem(VAULT_KEY) && !localStorage.getItem(PRIVATE_KEY);
window.migratePrivate=async()=>{
 const password=document.getElementById('privUnlockPass')?.value||'';
 try{
  const encrypted=JSON.parse(localStorage.getItem(VAULT_KEY));
  const key=await derivePrivateKey(password,unb64(encrypted.salt));
  const records=await decryptPrivate(key,encrypted);
  if(!Array.isArray(records))throw Error('Неверный файл');
  const normalized=records.map(x=>({...x,type:x.type==='oral'?'partner':x.type}));
  localStorage.setItem(PRIVATE_KEY,JSON.stringify(normalized));
  intimate=normalized;needsPrivateMigration=false;
  localStorage.removeItem(VAULT_KEY);renderPrivate();
 }catch(e){const status=document.getElementById('privLockStatus');if(status)status.textContent='Не удалось перенести записи. Проверь пароль.'}
};
function privateGate(){return '<h2 class="titleline">Перенос личных записей</h2><div class="card"><p class="hint">Найден старый зашифрованный дневник. Введи прежний пароль один раз, чтобы перенести записи в быстрый трекер без пароля.</p><input id="privUnlockPass" type="password" autocomplete="current-password" placeholder="Прежний пароль" style="width:100%"><button class="btn full" style="margin-top:12px" onclick="migratePrivate()">Перенести записи</button><p class="status" id="privLockStatus"></p></div>'}
let intimate=[];
try { const stored=JSON.parse(localStorage.getItem(PRIVATE_KEY)||'[]');if(Array.isArray(stored))intimate=stored; }catch(e){}
const intimateTypes={sex:'Секс',solo:'Мастурбация самостоятельно',partner:'Ласки жены (орально / руками)'};
// Совместимость с версией 1.6: старые записи «Оральный секс» объединяем с ласками жены.
const normalizeIntimateType=type=>type==='oral'?'partner':type;
if(intimate.some(x=>x.type==='oral')){intimate=intimate.map(x=>({...x,type:normalizeIntimateType(x.type)}));try{localStorage.setItem(PRIVATE_KEY,JSON.stringify(intimate))}catch(e){}}
let privateMonth=today().slice(0,7);
let selectedPrivateDate=today();
const privateIcons={sex:'❤️',solo:'✋',partner:'💋'};
function dayShift(date,shift){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+shift);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function intimateStreaks(){
 const days=new Set(intimate.map(x=>x.date));
 const sorted=[...days].sort();let longest=0,run=0,last='';
 for(const day of sorted){run=(last && dayShift(last,1)===day)?run+1:1;longest=Math.max(longest,run);last=day}
 let current=0,day=days.has(today())?today():dayShift(today(),-1);
 while(days.has(day)){current++;day=dayShift(day,-1)}
 return {current,longest,last:sorted.length?sorted[sorted.length-1]:null};
}
function privateCalendar(){
 const [year,mo]=privateMonth.split('-').map(Number);
 const first=new Date(year,mo-1,1,12);const offset=(first.getDay()+6)%7;
 const total=new Date(year,mo,0).getDate();
 const byDate={};for(const event of intimate){if(event.date.startsWith(privateMonth)){(byDate[event.date]??=[]).push(event)}}
 const labels=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const prevMonth=new Date(year,mo-2,1);const prev=prevMonth.getFullYear()+'-'+String(prevMonth.getMonth()+1).padStart(2,'0');
 const nextMonth=new Date(year,mo,1);const next=nextMonth.getFullYear()+'-'+String(nextMonth.getMonth()+1).padStart(2,'0');
 const title=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 let cells='';for(let i=0;i<offset;i++)cells+='<span class="calendar-day empty"></span>';
 for(let d=1;d<=total;d++){
  const date=privateMonth+'-'+String(d).padStart(2,'0');const events=byDate[date]||[];
  const kinds=[...new Set(events.map(x=>x.type))];
  const icons=kinds.map(x=>'<span>'+privateIcons[x]+'</span>').join('');
  const count=events.length>1?'<span class="calendar-multiple">×'+events.length+'</span>':'';
  const classes='calendar-day'+(date===today()?' today':'')+(date===selectedPrivateDate?' selected':'');
  cells+='<button type="button" class="'+classes+'"'+(date>today()?' disabled':'')+' onclick="selectPrivateDay(&quot;'+date+'&quot;)" aria-label="'+date+', событий: '+events.length+'"><span class="calendar-date">'+d+'</span><span class="calendar-symbols">'+icons+'</span>'+count+'</button>';
 }
 return '<div class="card"><div class="calendar-head"><b>Календарь · '+title+'</b><div class="calendar-actions"><button class="calendar-nav" type="button" onclick="changePrivateMonth(&quot;'+prev+'&quot;)" aria-label="Предыдущий месяц">‹</button><button class="calendar-nav" type="button" onclick="changePrivateMonth(&quot;'+next+'&quot;)" aria-label="Следующий месяц"'+(next>today().slice(0,7)?' disabled':'')+'>›</button></div></div><div class="calendar-week">'+labels.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="calendar-grid">'+cells+'</div><p class="hint" style="margin-top:12px">❤️ Секс · ✋ Самостоятельно · 💋 Ласки жены. Число × показывает количество событий за день. Нажми на дату, чтобы отметить событие.</p></div>';
}
window.selectPrivateDay=date=>{if(!privateDate(date)||date>today())return;selectedPrivateDate=date;privateMonth=date.slice(0,7);renderPrivate()};

function saveIntimate(){try{localStorage.setItem(PRIVATE_KEY,JSON.stringify(intimate));return true}catch(e){alert('Не удалось сохранить личные записи. Проверь место на устройстве.');return false}}
function privateDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'') && !Number.isNaN(new Date(s+'T12:00:00').getTime())}
window.addIntimate=async type=>{
 if(!Object.prototype.hasOwnProperty.call(intimateTypes,type))return;
 const date=document.getElementById('intimateDate')?.value||today();if(!privateDate(date)){alert('Выбери корректную дату');return;}
 const item={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),date,type};
 intimate.unshift(item);if(!saveIntimate()){intimate.shift();return;}
 privateMonth=date.slice(0,7);selectedPrivateDate=date;renderPrivate();

window.changePrivateMonth=v=>{if(/^\d{4}-\d{2}$/.test(v)&&v<=today().slice(0,7)){privateMonth=v;selectedPrivateDate=v===today().slice(0,7)?today():v+'-01';renderPrivate()}};
function privateSummary(records){return Object.keys(intimateTypes).map(k=>({key:k,label:intimateTypes[k],count:records.filter(x=>x.type===k).length}))}
function renderPrivate(){
 const host=document.getElementById('private');if(!host)return;if(needsPrivateMigration){host.innerHTML=privateGate();return;}
 const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-6);
 const startStr=start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
 const week=intimate.filter(x=>x.date>=startStr && x.date<=today());
 const month=intimate.filter(x=>x.date.startsWith(privateMonth));
 const sums=privateSummary(month);const max=Math.max(1,...sums.map(x=>x.count));const streaks=intimateStreaks();
 const privateMeta={sex:{icon:'❤️',label:'Секс',sub:'Половой акт'},solo:{icon:'✋',label:'Мастурбация',sub:'Самостоятельно'},partner:{icon:'💋',label:'Ласки жены',sub:'Орально или руками'}};
 host.innerHTML=`<h2 class="titleline">Личный трекер</h2><p class="muted small">Отмечай событие одним нажатием. Ласки жены включают оральный секс и стимуляцию руками; самостоятельная мастурбация учитывается отдельно. Можно добавить несколько событий в один день.</p>
 <div class="card private-hero"><div class="label">Дата события</div><input id="intimateDate" type="date" value="${selectedPrivateDate}" max="${today()}" onchange="selectedPrivateDate=this.value" style="width:100%;margin-bottom:12px">
 <div class="private-grid">${Object.entries(privateMeta).map(([k,v])=>`<button class="private-choice ${k}" onclick="addIntimate('${k}')"><div><div class="icon">${v.icon}</div><div class="main">${esc(v.label)}</div><span>${esc(v.sub)}</span></div></button>`).join('')}</div>
 <div class="status" id="privateStatus" aria-live="polite"></div></div>
 <h3 class="section">Календарь активности</h3>${privateCalendar()}
 <h3 class="section">Серии</h3><div class="grid"><div class="stat"><span class="small muted">Текущая серия</span><strong>${streaks.current} дн.</strong></div><div class="stat"><span class="small muted">Рекордная серия</span><strong>${streaks.longest} дн.</strong></div></div>
 <p class="streak-note">Серия — дни подряд, в которые было хотя бы одно событие. Если сегодня записей нет, вчерашняя серия ещё считается текущей. Перерывы — это нормально.</p>
 <h3 class="section">Статистика</h3><div class="grid"><div class="stat"><span class="small muted">За последние 7 дней</span><strong>${week.length}</strong></div><div class="stat"><span class="small muted">За выбранный месяц</span><strong>${month.length}</strong></div></div>
 <div class="card"><div class="row between"><b>По категориям</b><input aria-label="Месяц статистики" type="month" value="${privateMonth}" max="${today().slice(0,7)}" onchange="changePrivateMonth(this.value)" style="max-width:170px"></div>
 ${sums.map(x=>`<div style="margin-top:17px"><div class="row between"><span class="small">${esc(x.label)}</span><b>${x.count}</b></div><div class="mini-bars"><div class="mini-bar" style="width:${100*x.count/max}%"></div></div></div>`).join('')}</div>
 <h3 class="section">История за месяц</h3><div class="card">${month.length?month.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="private-row row between"><div><b>${esc(intimateTypes[x.type]||'Событие')}</b><div class="small muted">${fmt(x.date)}</div></div><button class="btn ghost" onclick="removeIntimate('${esc(x.id)}')">Удалить</button></div>`).join(''):'<div class="empty">В выбранном месяце записей нет</div>'}</div>
 <details class="card"><summary>Приватность и резервная копия</summary><p class="hint">Записи остаются в хранилище приложения на iPhone и не попадают в отчёт ChatGPT или в обычный спортивный бэкап. Пароля и дополнительного шифрования нет. Человек, который откроет приложение на разблокированном телефоне, сможет их увидеть. При удалении приложения или очистке данных записи могут исчезнуть — сохраняй отдельную резервную копию.</p><button class="btn secondary full" onclick="exportPrivate()">Скачать копию личных записей</button><button class="btn secondary full" style="margin-top:9px" onclick="document.getElementById('privateRestore').click()">Восстановить личные записи</button><input id="privateRestore" type="file" accept=".json,application/json" class="hidden" onchange="importPrivate(this)"></details>`;
}
window.exportPrivate=()=>{const blob=new Blob([JSON.stringify({version:1,events:intimate},null,2)],{type:'application/json'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download='moy-sport-private-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};
window.importPrivate=async el=>{
 const file=el.files?.[0];if(!file)return;
 try{
  const d=JSON.parse(await file.text());let events;
  if(Array.isArray(d.events)){events=d.events}
  else if(d.v===1&&d.salt&&d.iv&&d.ciphertext){
   const password=prompt('Пароль от старой зашифрованной копии (один раз для переноса):');
   if(password===null)return;
   const key=await derivePrivateKey(password,unb64(d.salt));
   events=await decryptPrivate(key,d);
  }else throw Error('Неверный формат');
  if(!Array.isArray(events)||events.some(x=>!privateDate(x.date)||!Object.prototype.hasOwnProperty.call(intimateTypes,normalizeIntimateType(x.type))))throw Error('Некорректные записи');
  if(confirm('Заменить текущие личные записи содержимым резервной копии?')){
   const old=intimate;intimate=events.map(x=>({...x,type:normalizeIntimateType(x.type)}));
   if(!saveIntimate())intimate=old;else{needsPrivateMigration=false;localStorage.removeItem(VAULT_KEY)}
   renderPrivate();
  }
 }catch(e){alert('Не удалось восстановить записи: проверь файл или пароль')}
 finally{el.value=''}
};

// Замеры тела: данные включены в обычную резервную копию спорта.
if(!Array.isArray(data.measurements))data.measurements=[];
const measureDefs=[
 ['waist','Талия','Самое узкое место, после спокойного выдоха'],
 ['navel','Живот','На уровне пупка'],
 ['chest','Грудь','По линии сосков, без вдоха'],
 ['hips','Ягодицы / бёдра','Самая широкая часть ягодиц'],
 ['shoulders','Плечи (обхват)','По самой широкой окружности плеч'],
 ['arm','Бицепс','Расслабленная рука, середина плеча'],
 ['forearm','Предплечье','Самое широкое место'],
 ['thigh','Бедро','По самой широкой части одного бедра'],
 ['calf','Голень','Самое широкое место'],
 ['neck','Шея','У основания шеи']
];
let measureChartKey='waist';
function measureByDate(date){return data.measurements.find(x=>x.date===date)}
function validMeasureDate(date){return /^\d{4}-\d{2}-\d{2}$/.test(date)&&date<=today()}
function renderMeasurements(){
 const d=today(),saved=measureByDate(d),recent=data.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const last=recent[0],prev=recent[1];
 const since=last?Math.floor((new Date(d+'T12:00:00')-new Date(last.date+'T12:00:00'))/86400000):null;
 const next=last?dayShift(last.date,14):null;
 const due=next&&next<=d;
 const fields=measureDefs.map(([key,name,guide])=>`<div class="measure-box"><div class="label">${name}, см</div><input type="number" name="${key}" inputmode="decimal" step="0.1" min="1" max="300" placeholder="—" value="${saved?.[key]??''}" aria-label="${name} в сантиметрах"><div class="hint">${guide}</div></div>`).join('');
 const table=measureDefs.map(([key,name])=>{
   const a=last?.[key],b=prev?.[key],n=Number(a),p=Number(b),hasA=a!==undefined&&a!=='';
   const change=hasA && b!==undefined && b!=='' ? n-p:null;
   return `<div class="history-item row between"><div><b>${name}</b><div class="measure-delta">${change===null?'Нет предыдущего значения':(change>0?'+':'')+change.toFixed(1)+' см к прошлому замеру'}</div></div><b>${hasA?n.toFixed(1)+' см':'—'}</b></div>`
 }).join('');
 const history=recent.map(x=>`<div class="history-item row between"><div><b>${fmt(x.date)}</b><div class="hint">${measureDefs.filter(([k])=>x[k]!==undefined&&x[k]!=='').map(([k,label])=>label+': '+x[k]).join(' · ')||'Нет данных'}</div></div><button class="btn ghost" type="button" onclick="loadMeasureDate('${x.date}')">Изменить</button></div>`).join('');
 document.getElementById('measurements').innerHTML=`<h2 class="titleline">📏 Замеры тела</h2><p class="muted small">Измеряй тело раз в две недели утром до завтрака, до тренировки, одной и той же лентой. Заполнять всё необязательно.</p>
 <div class="measure-reminder"><div class="row between"><b>Следующий замер</b><span class="measure-badge">Каждые 14 дней</span></div><div style="font-size:21px;font-weight:800;margin-top:8px">${last?(due?'Пора измериться':fmt(next)):'Сделай первый замер'}</div><div class="hint">${last?'Последний замер: '+fmt(last.date)+' ('+since+' дн. назад).':'После первой записи появится дата следующего измерения.'} Напоминание ChatGPT настроено отдельно.</div></div>
 <div class="card"><form id="measureForm"><div class="label">Дата измерений</div><input type="date" name="date" max="${d}" value="${d}" onchange="loadMeasureDate(this.value)" style="width:100%;margin-bottom:12px"><div class="measure-fields">${fields}</div><div class="label" style="margin-top:12px">Комментарий (необязательно)</div><textarea name="note" placeholder="После тренировки, отёки, замер другой лентой…">${esc(saved?.note||'')}</textarea><div class="saved-entry" id="measureSaved">${saved?'✓ Замеры за '+fmt(d)+' сохранены. Их можно исправить.':'За сегодня замеров пока нет'}</div><button type="submit" class="btn full">${saved?'Обновить':'Сохранить'} замеры</button><p class="status" id="measureStatus" aria-live="polite"></p></form></div>
 <h3 class="section">📈 Динамика</h3><div class="card"><label class="label" for="measureMetric">Показатель для графика</label><select id="measureMetric" class="measure-select" onchange="changeMeasureMetric(this.value)">${measureDefs.map(([k,v])=>`<option value="${k}" ${k===measureChartKey?'selected':''}>${v}</option>`).join('')}</select><div id="measureGraph">${measureChart(measureChartKey)}</div></div>
 <h3 class="section">Последние показатели</h3><div class="card">${last?'<div class="hint">'+fmt(last.date)+(prev?' по сравнению с '+fmt(prev.date):' — первый замер')+'</div>'+table:'<div class="empty">Первый замер создаст точку отсчёта</div>'}</div>
 <h3 class="section">История замеров</h3><div class="card">${history||'<div class="empty">История появится после первого измерения</div>'}</div>`;
 document.getElementById('measureForm').addEventListener('submit',saveMeasures);
}
function measureChart(key){
 const points=data.measurements.filter(x=>x[key]!==undefined&&x[key]!==''&&Number.isFinite(Number(x[key]))).slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(!points.length)return '<div class="empty">Для графика нужны сохранённые замеры</div>';
 const first=Number(points[0][key]),last=Number(points[points.length-1][key]);
 const diff=last-first,delta=(diff>0?'+':'')+diff.toFixed(1)+' см';
 if(points.length<2)return `<div class="saved-entry">${first.toFixed(1)} см · ${fmt(points[0].date)}. Для динамики добавь второй замер.</div>`;
 const w=340,h=168,p=24,values=points.map(x=>Number(x[key]));let lo=Math.min(...values),hi=Math.max(...values);const pad=Math.max(0.7,(hi-lo)*.15);lo-=pad;hi+=pad;
 const xy=points.map((x,i)=>[p+i*(w-2*p)/(points.length-1),h-p-(Number(x[key])-lo)/(hi-lo)*(h-2*p)]);
 const svg=`<svg class="measure-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="График измерений: от ${first.toFixed(1)} до ${last.toFixed(1)} сантиметров"><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#405266"/><polyline points="${xy.map(a=>a.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>${xy.map(a=>`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="4"/>`).join('')}<text x="${p}" y="${h-5}">${fmt(points[0].date)}</text><text x="${w-p}" y="${h-5}" text-anchor="end">${fmt(points[points.length-1].date)}</text><text x="${p}" y="15">${hi.toFixed(1)} см</text></svg>`;
 return `<div class="row between" style="margin-top:14px"><b>${last.toFixed(1)} см</b><span class="measure-badge">${delta} за период</span></div>${svg}<div class="hint">${points.length} измерений · изменения показывают тенденцию, не оценку успеха</div>`;
}
window.changeMeasureMetric=k=>{if(measureDefs.some(([v])=>v===k)){measureChartKey=k;document.getElementById('measureGraph').innerHTML=measureChart(k)}};
window.loadMeasureDate=date=>{
 if(!validMeasureDate(date))return;
 const form=document.getElementById('measureForm'),item=measureByDate(date);
 form.elements.date.value=date;
 for(const [key] of measureDefs)form.elements[key].value=item?.[key]??'';

 form.querySelector('button[type=submit]').textContent=(item?'Обновить':'Сохранить')+' замеры';
 document.getElementById('measureStatus').textContent='';
 form.scrollIntoView({behavior:'smooth',block:'start'});
};
function saveMeasures(ev){
 ev.preventDefault();const form=ev.currentTarget,date=form.elements.date.value;
 if(!validMeasureDate(date)){document.getElementById('measureStatus').textContent='Выбери корректную дату';return}
 const item={date,note:form.elements.note.value.trim()};let valid=0;
 for(const [key] of measureDefs){const val=form.elements[key].value;if(val!==''){
   const n=Number(val);if(!Number.isFinite(n)||n<1||n>300){document.getElementById('measureStatus').textContent='Проверь значения: только сантиметры';return}item[key]=Number(n.toFixed(1));valid++;
 }}
 if(!valid){document.getElementById('measureStatus').textContent='Заполни хотя бы один показатель';return}
 const old=copy(data.measurements);data.measurements=data.measurements.filter(x=>x.date!==date);data.measurements.push(item);data.measurements.sort((a,b)=>b.date.localeCompare(a.date));
 if(!save()){data.measurements=old;return}
 renderMeasurements();loadMeasureDate(date);document.getElementById('measureStatus').textContent='✓ Замеры сохранены. Можно изменить и сохранить повторно.';
}
